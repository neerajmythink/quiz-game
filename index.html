<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff9ee" />
    <title>Little Learners | Fun Learning Games</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
        color: #253b54;
        background: #fff9ee;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --ink: #253b54;
        --muted: #748398;
        --coral: #ff8178;
        --yellow: #ffd46c;
        --green: #56b895;
        --blue: #72b6e8;
        --lavender: #a994e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(ellipse at 7% 18%, #ffead0 0 7%, transparent 7.2%),
          radial-gradient(ellipse at 95% 82%, #e2f4e9 0 10%, transparent 10.2%),
          #fff9ee;
      }

      button {
        font: inherit;
      }

      .page {
        width: min(100% - 32px, 900px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 22px 0 28px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 24px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-size: 1rem;
        font-weight: 900;
        letter-spacing: -0.03em;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 14px;
        background: var(--yellow);
        box-shadow: 0 4px 0 #edbd4f;
        font-size: 1.15rem;
        animation: brand-bob 2.4s ease-in-out infinite;
      }

      .sound-button {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        gap: 7px;
        padding: 0 13px;
        border: 2px solid #efe6d6;
        border-radius: 15px;
        background: #fffefa;
        color: var(--ink);
        cursor: pointer;
        font-size: 0.88rem;
        font-weight: 800;
      }

      .sound-button:hover {
        border-color: #d6c7aa;
      }

      .sound-button:focus-visible,
      button:focus-visible {
        outline: 4px solid #253b5470;
        outline-offset: 3px;
      }

      main {
        display: flex;
        min-height: calc(100vh - 126px);
        align-items: center;
        justify-content: center;
      }

      .game {
        width: 100%;
        padding: clamp(22px, 5vw, 42px);
        border: 2px solid #f2eadb;
        border-radius: 32px;
        background: #fffefa;
        box-shadow: 0 14px 0 #eee5d6, 0 22px 48px #76664d12;
        text-align: center;
      }

      .landing {
        padding: clamp(25px, 5vw, 46px);
      }

      .landing-hero {
        margin-bottom: 30px;
      }

      .subject-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        max-width: 820px;
        margin: 28px auto 0;
        text-align: left;
      }

      .subject-card {
        display: flex;
        min-height: 170px;
        align-items: center;
        gap: 12px;
        padding: 18px;
        border: 3px solid transparent;
        border-radius: 26px;
        color: var(--ink);
        cursor: pointer;
        text-align: left;
        transition: transform 140ms ease, box-shadow 140ms ease;
      }

      .subject-card:hover {
        transform: translateY(-4px);
      }

      .subject-card {
        animation: card-pop 480ms both;
      }

      .subject-card:hover .subject-icon {
        animation-play-state: paused;
        transform: scale(1.08) rotate(-5deg);
      }

      .subject-card:nth-child(2) {
        animation-delay: 90ms;
      }

      .subject-card:nth-child(3) {
        animation-delay: 180ms;
      }

      .subject-card.english {
        border-color: #ffd5c9;
        background: #fff0eb;
        box-shadow: 0 6px 0 #ffd5c9;
      }

      .subject-card.math {
        border-color: #cce8da;
        background: #edfaf2;
        box-shadow: 0 6px 0 #cce8da;
      }

      .subject-card.hindi {
        border-color: #d9cff5;
        background: #f4f0ff;
        box-shadow: 0 6px 0 #d9cff5;
      }

      .subject-icon {
        display: grid;
        width: 76px;
        height: 76px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 24px;
        background: #ffffffbd;
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        font-size: 2.8rem;
        animation: icon-float 2.7s ease-in-out infinite;
      }

      .quiz-screen-enter {
        animation: screen-enter 420ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .finish-screen-enter {
        animation: screen-enter 420ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .prompt {
        animation: prompt-pop 380ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .picture {
        animation: picture-float 2.4s ease-in-out infinite;
      }

      .subject-copy {
        display: grid;
        gap: 6px;
      }

      .subject-name {
        font-size: 1.35rem;
        font-weight: 1000;
        letter-spacing: -0.04em;
      }

      .subject-description {
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 700;
        line-height: 1.4;
      }

      .subject-arrow {
        margin-left: auto;
        color: #5a8f78;
        font-size: 1.5rem;
        font-weight: 1000;
      }

      .more-subjects {
        margin: 30px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 800;
      }

      .coming-soon {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      .coming-soon span {
        padding: 8px 13px;
        border-radius: 14px;
        background: #f5f1e9;
        color: #7b8793;
        font-size: 0.83rem;
        font-weight: 800;
      }

      .back-button {
        display: block;
        margin: 0 auto 18px;
        padding: 8px 12px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-weight: 900;
      }

      .back-button:hover {
        background: #f5f1e9;
        color: var(--ink);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #e07957;
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-size: clamp(2rem, 7vw, 3.35rem);
        font-weight: 1000;
        letter-spacing: -0.065em;
        line-height: 1.07;
      }

      .subtitle {
        max-width: 420px;
        margin: 12px auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 3.5vw, 1.12rem);
        line-height: 1.55;
      }

      .start-art {
        display: flex;
        justify-content: center;
        gap: clamp(4px, 3vw, 22px);
        margin: 24px 0 30px;
      }

      .start-letter {
        display: grid;
        width: clamp(68px, 18vw, 112px);
        aspect-ratio: 1;
        place-items: center;
        border-radius: 28px;
        color: var(--ink);
        font-size: clamp(2.5rem, 12vw, 5rem);
        font-weight: 1000;
        transform: rotate(var(--tilt));
      }

      .start-letter:nth-child(1) {
        background: #ffe5df;
      }

      .start-letter:nth-child(2) {
        background: #fff0c6;
      }

      .start-letter:nth-child(3) {
        background: #dff3e8;
      }

      .start-letter:nth-child(4) {
        background: #e7e1fb;
      }

      .primary-button {
        min-width: 205px;
        min-height: 60px;
        padding: 12px 28px;
        border: 0;
        border-radius: 20px;
        background: var(--green);
        box-shadow: 0 6px 0 #378f70;
        color: white;
        cursor: pointer;
        font-size: 1.25rem;
        font-weight: 1000;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .primary-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 0 #378f70;
      }

      .primary-button:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #378f70;
      }

      .round-header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 27px;
        text-align: left;
      }

      .round-label {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 800;
      }

      .progress {
        display: flex;
        flex: 1;
        gap: 5px;
      }

      .progress-dot {
        height: 9px;
        flex: 1;
        border-radius: 10px;
        background: #eee9df;
      }

      .progress-dot.done {
        background: var(--green);
      }

      .progress-dot.current {
        background: var(--yellow);
      }

      .score {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 5px;
        color: #b47b22;
        font-size: 0.95rem;
        font-weight: 900;
      }

      .prompt {
        width: min(100%, 280px);
        min-height: 210px;
        margin: 0 auto;
        padding: 20px;
        border: 3px solid #f4eddf;
        border-radius: 28px;
        background: #fffaf0;
      }

      .picture {
        display: grid;
        min-height: 122px;
        place-items: center;
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        font-size: clamp(5rem, 20vw, 7rem);
        line-height: 1;
      }

      .picture-name {
        margin: 8px 0 0;
        color: var(--ink);
        font-size: 1.35rem;
        font-weight: 1000;
        letter-spacing: -0.035em;
      }

      .picture.counting {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        align-content: center;
        justify-items: center;
        gap: 4px;
        padding: 10px 0;
        font-size: clamp(2rem, 8vw, 3rem);
      }

      .question {
        margin: 22px 0 16px;
        color: var(--ink);
        font-size: clamp(1.1rem, 4vw, 1.35rem);
        font-weight: 900;
      }

      .music-note {
        margin: -7px 0 14px;
        color: var(--muted);
        font-size: 0.84rem;
        line-height: 1.45;
      }

      .choices {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(10px, 3vw, 18px);
        width: min(100%, 460px);
        margin: 0 auto;
      }

      .choice {
        min-height: 94px;
        border: 3px solid #e9e5dd;
        border-radius: 23px;
        background: white;
        box-shadow: 0 5px 0 #e9e5dd;
        color: var(--ink);
        cursor: pointer;
        font-size: clamp(2.6rem, 10vw, 4rem);
        font-weight: 1000;
        transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      }

      .choice:not(:disabled):hover {
        transform: translateY(-3px);
        border-color: #b9d8c8;
        background: #f5fcf8;
      }

      .choice:disabled {
        cursor: default;
      }

      .choice.correct {
        position: relative;
        border-color: var(--green);
        background: #e8f8ef;
        box-shadow: 0 5px 0 #b2dfc6;
        color: #318568;
        animation: happy-pop 520ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .choice.correct::after {
        position: absolute;
        top: -18px;
        right: -12px;
        content: "✨";
        font-size: 1.5rem;
        animation: sparkle 850ms ease-out both;
      }

      .choice.incorrect {
        border-color: #ffa29a;
        background: #fff0ee;
        box-shadow: 0 5px 0 #ffd4cf;
        color: #ce625d;
        animation: wiggle 250ms ease;
      }

      .feedback {
        min-height: 33px;
        margin: 16px 0 0;
        color: #398d70;
        font-size: 1.08rem;
        font-weight: 1000;
      }

      .feedback.try-again {
        color: #cb765f;
      }

      .feedback:not(:empty) {
        animation: feedback-pop 280ms ease-out both;
      }

      .next-button {
        min-width: 175px;
        min-height: 54px;
        margin-top: 5px;
        font-size: 1.08rem;
      }

      .hidden {
        display: none !important;
      }

      .finish-stars {
        margin: 25px 0 15px;
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        font-size: clamp(3.3rem, 14vw, 5rem);
        letter-spacing: 0.04em;
      }

      .finish-score {
        margin: 20px 0 26px;
        color: #b47b22;
        font-size: 1.25rem;
        font-weight: 900;
      }

      .footer-note {
        margin: 28px 0 0;
        color: #9a9c9c;
        font-size: 0.8rem;
        text-align: center;
      }

      @keyframes wiggle {
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }

      @keyframes brand-bob {
        50% { transform: translateY(-4px) rotate(5deg); }
      }

      @keyframes card-pop {
        from { opacity: 0; transform: translateY(12px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes icon-float {
        50% { transform: translateY(-4px) rotate(3deg); }
      }

      @keyframes screen-enter {
        from { opacity: 0; transform: translateY(12px) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes prompt-pop {
        from { opacity: 0; transform: scale(0.94); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes picture-float {
        50% { transform: translateY(-5px) rotate(2deg); }
      }

      @keyframes happy-pop {
        40% { transform: scale(1.1) rotate(-2deg); }
        70% { transform: scale(0.97) rotate(2deg); }
      }

      @keyframes sparkle {
        from { opacity: 0; transform: translateY(8px) scale(0.5) rotate(-20deg); }
        35% { opacity: 1; }
        to { opacity: 0; transform: translateY(-20px) scale(1.2) rotate(20deg); }
      }

      @keyframes feedback-pop {
        from { opacity: 0; transform: translateY(5px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @media (max-width: 480px) {
        .page {
          width: min(100% - 22px, 760px);
          padding-top: 14px;
        }

        .topbar {
          margin-bottom: 14px;
        }

        main {
          min-height: calc(100vh - 95px);
        }

        .game {
          padding: 25px 18px;
          border-radius: 27px;
        }

        .subject-grid {
          gap: 13px;
          margin-top: 23px;
        }

        .subject-card {
          min-height: 140px;
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
          padding: 13px;
          border-radius: 21px;
        }

        .subject-icon {
          width: 58px;
          height: 58px;
          border-radius: 18px;
          font-size: 2.1rem;
        }

        .subject-name {
          font-size: 1.08rem;
        }

        .subject-description {
          font-size: 0.8rem;
        }

        .subject-arrow {
          display: none;
        }

        .round-header {
          gap: 9px;
          margin-bottom: 20px;
        }

        .round-label,
        .score {
          font-size: 0.78rem;
        }

        .prompt {
          min-height: 188px;
          padding: 13px;
        }

        .picture {
          min-height: 112px;
        }

        .choice {
          min-height: 82px;
          border-radius: 19px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="#" id="home-link" aria-label="Little Learners home">
          <span class="brand-mark" aria-hidden="true">🌱</span>
          <span>Little Learners</span>
        </a>
        <button class="sound-button" id="sound-button" type="button" aria-pressed="true">
          <span id="sound-icon" aria-hidden="true">🎵</span>
          <span id="sound-label">Music on</span>
        </button>
      </header>

      <main>
        <section class="game" aria-live="polite">
          <div id="welcome-screen" class="landing">
            <div class="landing-hero">
              <p class="eyebrow">Little games, big discoveries</p>
              <h1>What shall we<br />learn today?</h1>
              <p class="subtitle">Pick a subject and let’s play together!</p>
            </div>
            <div class="subject-grid" aria-label="Choose a subject">
              <button class="subject-card english" type="button" data-subject="english">
                <span class="subject-icon" aria-hidden="true">🔤</span>
                <span class="subject-copy">
                  <span class="subject-name">English</span>
                  <span class="subject-description">Match letters to pictures</span>
                </span>
                <span class="subject-arrow" aria-hidden="true">→</span>
              </button>
              <button class="subject-card math" type="button" data-subject="math">
                <span class="subject-icon" aria-hidden="true">🔢</span>
                <span class="subject-copy">
                  <span class="subject-name">Math</span>
                  <span class="subject-description">Count the fun things</span>
                </span>
                <span class="subject-arrow" aria-hidden="true">→</span>
              </button>
              <button class="subject-card hindi" type="button" data-subject="hindi">
                <span class="subject-icon" aria-hidden="true">अ</span>
                <span class="subject-copy">
                  <span class="subject-name">Hindi</span>
                  <span class="subject-description">चित्रों से अक्षर पहचानें</span>
                </span>
                <span class="subject-arrow" aria-hidden="true">→</span>
              </button>
            </div>
            <p class="more-subjects">More fun is on the way!</p>
            <div class="coming-soon" aria-label="More subjects coming soon">
              <span>🎨 Colors</span>
              <span>🔺 Shapes</span>
              <span>🌍 Nature</span>
            </div>
          </div>

          <div id="quiz-screen" class="hidden">
            <button class="back-button" id="back-button" type="button">← Choose another game</button>
            <div class="round-header">
              <span class="round-label" id="round-label">1 of 10</span>
              <div class="progress" id="progress" aria-label="Game progress"></div>
              <span class="score" aria-label="Stars earned"><span aria-hidden="true">⭐</span><span id="score">0</span></span>
            </div>
            <div class="prompt">
              <div class="picture" id="picture" role="img" aria-label=""></div>
              <p class="picture-name" id="picture-name"></p>
            </div>
            <p class="question" id="question"></p>
            <p class="music-note hidden" id="music-note" role="status"></p>
            <div class="choices" id="choices" role="group" aria-label="Answer choices"></div>
            <p class="feedback" id="feedback" aria-live="assertive"></p>
            <button class="primary-button next-button hidden" id="next-button" type="button">Next picture <span aria-hidden="true">→</span></button>
          </div>

          <div id="finish-screen" class="hidden">
            <p class="eyebrow">You did it!</p>
            <h1>Super star!</h1>
            <div class="finish-stars" aria-hidden="true">🌟🌱🌟</div>
            <p class="subtitle" id="finish-message">Great job, little learner!</p>
            <p class="finish-score" id="finish-score"></p>
            <button class="primary-button" id="play-again-button" type="button">Play again <span aria-hidden="true">↻</span></button>
            <button class="back-button" id="finish-back-button" type="button">← Choose another game</button>
          </div>
        </section>
      </main>
      <p class="footer-note">Made for curious little learners ✨</p>
    </div>

    <script>
      const pictures = [
        { letter: "A", word: "Apple", emoji: "🍎" },
        { letter: "B", word: "Ball", emoji: "⚽" },
        { letter: "C", word: "Cat", emoji: "🐱" },
        { letter: "D", word: "Dog", emoji: "🐶" },
        { letter: "E", word: "Elephant", emoji: "🐘" },
        { letter: "F", word: "Fish", emoji: "🐠" },
        { letter: "G", word: "Grapes", emoji: "🍇" },
        { letter: "H", word: "House", emoji: "🏠" },
        { letter: "I", word: "Ice cream", emoji: "🍦" },
        { letter: "J", word: "Juice", emoji: "🧃" },
        { letter: "K", word: "Kite", emoji: "🪁" },
        { letter: "L", word: "Lion", emoji: "🦁" },
        { letter: "M", word: "Moon", emoji: "🌙" },
        { letter: "N", word: "Nest", emoji: "🪺" },
        { letter: "O", word: "Owl", emoji: "🦉" },
        { letter: "P", word: "Pizza", emoji: "🍕" },
        { letter: "Q", word: "Queen", emoji: "👑" },
        { letter: "R", word: "Rainbow", emoji: "🌈" },
        { letter: "S", word: "Sun", emoji: "☀️" },
        { letter: "T", word: "Turtle", emoji: "🐢" },
        { letter: "U", word: "Umbrella", emoji: "☂️" },
        { letter: "V", word: "Van", emoji: "🚐" },
        { letter: "W", word: "Whale", emoji: "🐳" },
        { letter: "X", word: "Xylophone", emoji: "🎵" },
        { letter: "Y", word: "Yoyo", emoji: "🪀" },
        { letter: "Z", word: "Zebra", emoji: "🦓" },
      ];
      const mathThings = [
        { word: "apples", emoji: "🍎" },
        { word: "balls", emoji: "⚽" },
        { word: "cats", emoji: "🐱" },
        { word: "ducks", emoji: "🦆" },
        { word: "fish", emoji: "🐠" },
        { word: "flowers", emoji: "🌼" },
        { word: "stars", emoji: "⭐" },
        { word: "frogs", emoji: "🐸" },
        { word: "cookies", emoji: "🍪" },
        { word: "butterflies", emoji: "🦋" },
      ];
      const hindiPictures = [
        { letter: "अ", word: "अनार", emoji: "🍎" },
        { letter: "आ", word: "आम", emoji: "🥭" },
        { letter: "इ", word: "इमली", emoji: "🌿" },
        { letter: "उ", word: "उल्लू", emoji: "🦉" },
        { letter: "ऊ", word: "ऊन", emoji: "🧶" },
        { letter: "क", word: "कमल", emoji: "🪷" },
        { letter: "ख", word: "खरगोश", emoji: "🐇" },
        { letter: "ग", word: "गमला", emoji: "🪴" },
        { letter: "घ", word: "घर", emoji: "🏠" },
        { letter: "च", word: "चम्मच", emoji: "🥄" },
        { letter: "छ", word: "छाता", emoji: "☂️" },
        { letter: "ज", word: "जहाज", emoji: "🚢" },
        { letter: "ट", word: "टमाटर", emoji: "🍅" },
        { letter: "ड", word: "डमरू", emoji: "🥁" },
        { letter: "त", word: "तरबूज", emoji: "🍉" },
        { letter: "न", word: "नल", emoji: "🚰" },
        { letter: "प", word: "पतंग", emoji: "🪁" },
        { letter: "फ", word: "फल", emoji: "🍐" },
        { letter: "ब", word: "बतख", emoji: "🦆" },
        { letter: "भ", word: "भालू", emoji: "🐻" },
        { letter: "म", word: "मछली", emoji: "🐟" },
        { letter: "र", word: "रथ", emoji: "🛺" },
        { letter: "ल", word: "लड्डू", emoji: "🍡" },
        { letter: "ह", word: "हाथी", emoji: "🐘" },
      ];
      const roundLength = 10;
      const cheers = ["Great job!", "You got it!", "Hooray!", "Fantastic!", "That’s right!"];
      let roundPictures = [];
      let roundIndex = 0;
      let score = 0;
      let answered = false;
      let soundEnabled = true;
      let gameMode = "english";
      let audioContext;
      let musicTimer;
      let musicStep = 0;

      const welcomeScreen = document.querySelector("#welcome-screen");
      const quizScreen = document.querySelector("#quiz-screen");
      const finishScreen = document.querySelector("#finish-screen");
      const progress = document.querySelector("#progress");
      const pictureElement = document.querySelector("#picture");
      const pictureName = document.querySelector("#picture-name");
      const choices = document.querySelector("#choices");
      const feedback = document.querySelector("#feedback");
      const nextButton = document.querySelector("#next-button");
      const soundButton = document.querySelector("#sound-button");
      const questionElement = document.querySelector("#question");
      const musicNote = document.querySelector("#music-note");

      function showMusicMessage(message) {
        musicNote.textContent = message;
        musicNote.classList.toggle("hidden", !message);
      }

      function playTone(frequency, duration, volume, startAt, type = "sine") {
        const oscillator = audioContext.createOscillator();
        const envelope = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, startAt);
        envelope.gain.setValueAtTime(0.0001, startAt);
        envelope.gain.exponentialRampToValueAtTime(volume, startAt + 0.025);
        envelope.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
        oscillator.connect(envelope);
        envelope.connect(audioContext.destination);
        oscillator.start(startAt);
        oscillator.stop(startAt + duration);
      }

      function playSequence(notes, spacing = 0.13, volume = 0.045, duration = 0.32) {
        if (!soundEnabled || audioContext?.state !== "running") return;
        const startAt = audioContext.currentTime + 0.02;
        notes.forEach((note, index) => {
          if (note === null) return;
          const frequency = 440 * (2 ** ((note - 69) / 12));
          playTone(frequency, duration, volume, startAt + index * spacing);
        });
      }

      function playMusicStep() {
        const melody = [72, 76, 79, 76, 74, 79, null, 79, 72, 76, 79, 81, 79, null, 74, 72];
        const note = melody[musicStep % melody.length];
        if (note !== null) playSequence([note], 0, 0.022, 0.42);
        if (musicStep % 4 === 0) {
          const bass = [48, 55, 53, 55][Math.floor(musicStep / 4) % 4];
          playSequence([bass], 0, 0.009, 0.72);
        }
        musicStep += 1;
      }

      async function startMusic() {
        if (!soundEnabled) return;
        if (!window.AudioContext) {
          showMusicMessage("Music isn't supported by this browser.");
          return;
        }

        try {
          audioContext ??= new window.AudioContext();
          await audioContext.resume();
        } catch (error) {
          showMusicMessage("Music couldn't start. Try turning music off and on again.");
          console.error("Unable to start game music.", error);
          return;
        }

        showMusicMessage("");
        if (!musicTimer) {
          musicStep = 0;
          playMusicStep();
          musicTimer = window.setInterval(playMusicStep, 520);
        }
      }

      async function stopMusic() {
        window.clearInterval(musicTimer);
        musicTimer = undefined;
        if (audioContext?.state === "running") {
          try {
            await audioContext.suspend();
          } catch (error) {
            showMusicMessage("Music couldn't be paused. Try reloading the game.");
            console.error("Unable to pause game music.", error);
          }
        }
      }

      function shuffle(items) {
        const shuffled = [...items];
        for (let index = shuffled.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
        }
        return shuffled;
      }

      async function beginGame(subject = gameMode) {
        gameMode = subject;
        roundPictures = gameMode === "english"
          ? shuffle(pictures).slice(0, roundLength)
          : gameMode === "math"
            ? shuffle(mathThings).map((item) => ({ ...item, count: Math.floor(Math.random() * 10) + 1 }))
            : shuffle(hindiPictures).slice(0, roundLength);
        roundIndex = 0;
        score = 0;
        welcomeScreen.classList.add("hidden");
        finishScreen.classList.add("hidden");
        quizScreen.classList.remove("hidden");
        quizScreen.classList.remove("quiz-screen-enter");
        void quizScreen.offsetWidth;
        quizScreen.classList.add("quiz-screen-enter");
        renderQuestion();
        await startMusic();
      }

      function renderProgress() {
        progress.replaceChildren();
        for (let index = 0; index < roundLength; index += 1) {
          const dot = document.createElement("span");
          dot.className = "progress-dot";
          if (index < roundIndex) dot.classList.add("done");
          if (index === roundIndex) dot.classList.add("current");
          progress.append(dot);
        }
        progress.setAttribute("aria-label", `Question ${roundIndex + 1} of ${roundLength}`);
      }

      function renderQuestion() {
        const current = roundPictures[roundIndex];
        answered = false;
        renderProgress();
        const prompt = document.querySelector(".prompt");
        prompt.classList.remove("prompt-pop");
        void prompt.offsetWidth;
        prompt.classList.add("prompt-pop");
        document.querySelector("#round-label").textContent = `${roundIndex + 1} of ${roundLength}`;
        document.querySelector("#score").textContent = String(score);
        pictureElement.classList.toggle("counting", gameMode === "math");
        if (gameMode === "math") {
          pictureElement.replaceChildren(...Array.from({ length: current.count }, () => {
            const item = document.createElement("span");
            item.textContent = current.emoji;
            item.setAttribute("aria-hidden", "true");
            return item;
          }));
          pictureElement.setAttribute("aria-label", `${current.count} ${current.word}`);
          pictureName.textContent = "Count them!";
          questionElement.textContent = `How many ${current.word} do you see?`;
        } else if (gameMode === "hindi") {
          pictureElement.textContent = current.emoji;
          pictureElement.setAttribute("aria-label", current.word);
          pictureElement.setAttribute("lang", "hi");
          pictureName.textContent = current.word;
          pictureName.setAttribute("lang", "hi");
          questionElement.textContent = "यह किस अक्षर से शुरू होता है?";
          questionElement.setAttribute("lang", "hi");
        } else {
          pictureElement.textContent = current.emoji;
          pictureElement.setAttribute("aria-label", current.word);
          pictureElement.removeAttribute("lang");
          pictureName.textContent = current.word;
          pictureName.removeAttribute("lang");
          questionElement.textContent = "Which letter does it start with?";
          questionElement.removeAttribute("lang");
        }
        feedback.textContent = "";
        feedback.classList.remove("try-again");
        nextButton.classList.add("hidden");

        const answer = gameMode === "math" ? String(current.count) : current.letter;
        const wrongAnswers = gameMode === "math"
          ? shuffle(Array.from({ length: 10 }, (_, index) => String(index + 1)).filter((number) => number !== answer)).slice(0, 2)
          : shuffle((gameMode === "hindi" ? hindiPictures : pictures)
            .filter((item) => item.letter !== answer)).slice(0, 2).map((item) => item.letter);
        const options = shuffle([answer, ...wrongAnswers]);
        choices.replaceChildren();
        options.forEach((option) => {
          const button = document.createElement("button");
          button.className = "choice";
          button.type = "button";
          button.textContent = option;
          button.setAttribute("aria-label", gameMode === "math"
            ? `Number ${option}`
            : gameMode === "hindi" ? `अक्षर ${option}` : `Letter ${option}`);
          button.addEventListener("click", () => chooseAnswer(button, option, current));
          choices.append(button);
        });
      }

      function chooseAnswer(button, answer, current) {
        if (answered) return;
        const correctAnswer = gameMode === "math" ? String(current.count) : current.letter;
        if (answer !== correctAnswer) {
          button.classList.add("incorrect");
          button.disabled = true;
          feedback.textContent = "Nearly! Try another letter.";
          feedback.classList.add("try-again");
          feedback.textContent = gameMode === "math"
            ? "Nearly! Try counting again."
            : gameMode === "hindi" ? "फिर से कोशिश करो!" : "Nearly! Try another letter.";
          playSequence([67, 64], 0.14, 0.028, 0.2);
          return;
        }
        answered = true;
        score += 1;
        button.classList.add("correct");
        choices.querySelectorAll("button").forEach((choice) => {
          choice.disabled = true;
        });
        document.querySelector("#score").textContent = String(score);
        const cheer = cheers[Math.floor(Math.random() * cheers.length)];
        feedback.textContent = gameMode === "math"
          ? `${cheer} There are ${current.count} ${current.word}!`
          : gameMode === "hindi"
            ? `शाबाश! ${current.word}, ${current.letter} से शुरू होता है!`
            : `${cheer} ${current.word} starts with ${current.letter}!`;
        nextButton.innerHTML = roundIndex === roundLength - 1
          ? 'See my stars <span aria-hidden="true">★</span>'
          : 'Next picture <span aria-hidden="true">→</span>';
        nextButton.classList.remove("hidden");
        playSequence([72, 76, 79, 84], 0.11, 0.05, 0.34);
        nextButton.focus();
      }

      function advanceRound() {
        roundIndex += 1;
        if (roundIndex >= roundLength) {
          quizScreen.classList.add("hidden");
          finishScreen.classList.remove("hidden");
          finishScreen.classList.remove("finish-screen-enter");
          void finishScreen.offsetWidth;
          finishScreen.classList.add("finish-screen-enter");
          document.querySelector("#finish-message").textContent = gameMode === "math"
            ? "You counted all the fun things. Great job, little learner!"
            : gameMode === "hindi"
              ? "तुमने सारे अक्षर पहचान लिए! शाबाश!"
              : "You found letters for all the pictures. Great job, little learner!";
          document.querySelector("#finish-score").textContent =
            `You earned ${score} ${score === 1 ? "star" : "stars"}!`;
          playSequence([72, 76, 79, 84, 79, 84, 88], 0.16, 0.055, 0.42);
          document.querySelector("#play-again-button").focus();
          return;
        }
        renderQuestion();
      }

      document.querySelectorAll("[data-subject]").forEach((button) => {
        button.addEventListener("click", () => beginGame(button.dataset.subject));
      });
      document.querySelector("#play-again-button").addEventListener("click", () => beginGame());
      document.querySelector("#back-button").addEventListener("click", showLanding);
      document.querySelector("#finish-back-button").addEventListener("click", showLanding);
      document.querySelector("#home-link").addEventListener("click", (event) => {
        event.preventDefault();
        showLanding();
      });
      nextButton.addEventListener("click", advanceRound);
      soundButton.addEventListener("click", async () => {
        soundEnabled = !soundEnabled;
        soundButton.setAttribute("aria-pressed", String(soundEnabled));
        if (soundEnabled) {
          document.querySelector("#sound-icon").textContent = "🎵";
          document.querySelector("#sound-label").textContent = "Music on";
          if (!quizScreen.classList.contains("hidden") || !finishScreen.classList.contains("hidden")) {
            await startMusic();
          }
        } else {
          document.querySelector("#sound-icon").textContent = "🔇";
          document.querySelector("#sound-label").textContent = "Music off";
          showMusicMessage("");
          await stopMusic();
        }
      });

      function showLanding() {
        void stopMusic();
        quizScreen.classList.add("hidden");
        finishScreen.classList.add("hidden");
        welcomeScreen.classList.remove("hidden");
        document.querySelector(".subject-card").focus();
      }
    </script>
  </body>
</html>
